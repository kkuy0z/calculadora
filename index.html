<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }

        .calc {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
            width: 300px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .display {
            background: #eee;
            padding: 15px;
            text-align: right;
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .inputs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .inputs input {
            flex: 0 0 15%;
            padding: 5px;
            font-size: .9rem;
            height: 20px;
            width: 130px;
        }

        .btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .num {
            background: #eee;
        }

        .op {
            background: #4285f4;
            color: white;
        }

        .eq {
            background: #34a853;
            color: white;
            grid-column: span 2;
        }

        .cl {
            background: #ea4335;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="calc">
        <h1>Calculadora</h1>
        <div class="display" id="d">0</div>
        <div class="inputs">
            <input id="n1" placeholder="Número 1">
            <input id="n2" placeholder="Número 2">
        </div>
        <div class="btns">
            <button class="num" onclick="n('7')">7</button>
            <button class="num" onclick="n('8')">8</button>
            <button class="num" onclick="n('9')">9</button>
            <button class="op" onclick="op('add')">+</button>
            <button class="num" onclick="n('4')">4</button>
            <button class="num" onclick="n('5')">5</button>
            <button class="num" onclick="n('6')">6</button>
            <button class="op" onclick="op('sub')">-</button>
            <button class="num" onclick="n('1')">1</button>
            <button class="num" onclick="n('2')">2</button>
            <button class="num" onclick="n('3')">3</button>
            <button class="op" onclick="op('mul')">×</button>
            <button class="num" onclick="n('0')">0</button>
            <button class="num" onclick="n('.')">.</button>
            <button class="op" onclick="op('div')">÷</button>
            <button class="eq" onclick="calc()">=</button>
            <button class="cl" onclick="cl()">C</button>
        </div>
    </div>
    <script>
        let v = '0', o = null, t = 'n1';
        const d = document.getElementById('d'), n1 = document.getElementById('n1'), n2 = document.getElementById('n2');
        const u = () => d.textContent = v;
        const n = (x) => { v = v === '0' && x !== '.' ? x : v + x; (t === 'n1' ? n1 : n2).value = v; u(); };
        const op = (x) => { o = x; t = 'n2'; v = '0'; u(); };
        const cl = () => { v = '0'; o = null; t = 'n1'; n1.value = n2.value = ''; u(); };
        const calc = async () => {
            if (!o) return;
            const r = await fetch('/c', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a: +n1.value, b: +n2.value, o }) });
            const j = await r.json();
            if (j.e) return d.textContent = 'Erro';
            v = String(j.r); n1.value = j.r; n2.value = ''; o = null; t = 'n1'; u();
        };
    </script>
</body>

</html>
